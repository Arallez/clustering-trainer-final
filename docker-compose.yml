services:
  db:
    image: postgres:14-alpine
    environment:
      POSTGRES_DB: clustering_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d clustering_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_NAME=clustering_db
      - DB_USER=admin
      - DB_PASSWORD=secretpassword
      - DB_HOST=db
      - DB_PORT=5432
      - SECRET_KEY=django-insecure-docker-dev-key-change-in-production
      - DEBUG=True
      - SANDBOX_EXECUTOR=docker
      - SANDBOX_IMAGE=clustering-sandbox:latest
      - SANDBOX_ALLOW_INPROCESS_FALLBACK=True

  sandbox:
    build:
      context: .
      dockerfile: sandbox/Dockerfile
    image: clustering-sandbox:latest
    profiles: ["sandbox"]
    entrypoint: ["sleep", "infinity"]
    network_mode: "none"
    read_only: true

volumes:
  postgres_data:
